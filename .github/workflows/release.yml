name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build/upload (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'release' && github.ref_name || github.event.inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Ensure web/dist placeholder for Go embed
        run: |
          set -euo pipefail
          mkdir -p web/dist
          if [ ! -f web/dist/placeholder.txt ]; then
            printf "This file keeps web/dist non-empty so Go embed works before the first web build.\n" > web/dist/placeholder.txt
          fi

      - name: Test
        run: pnpm test

      - name: Build web UI
        run: pnpm -C web build

      - name: Build release binaries
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          mkdir -p dist/release

          build_one() {
            local name="$1"
            local goos="$2"
            local goarch="$3"
            local ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi

            local dir="dist/release/controlccx_${VERSION}_${name}"
            mkdir -p "$dir"
            echo "Building ${name} (${goos}/${goarch})..."
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -o "${dir}/controlccx${ext}" ./cmd/controlccx-server

            if [ "$goos" = "windows" ]; then
              (cd "$dir" && zip -q "../controlccx_${VERSION}_${name}.zip" "controlccx${ext}")
            else
              (cd "$dir" && tar -czf "../controlccx_${VERSION}_${name}.tar.gz" "controlccx${ext}")
            fi
          }

          build_one linux_amd linux amd64
          build_one mac_amd darwin amd64
          build_one mac_arm darwin arm64
          build_one win_amd windows amd64

          (cd dist/release && sha256sum *.tar.gz *.zip > SHA256SUMS.txt)

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
